# https://glitchtip.com/documentation/install
services:
  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_VERSION:-6}
    ports:
      - "${GLITCHTIP_PORT:-8001}:8000"
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/glitchtip}
      VALKEY_URL: ""
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Set GLITCHTIP_SECRET_KEY in .env}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_DEFAULT_FROM_EMAIL:-glitchtip@localhost}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8001}
      SERVER_ROLE: all_in_one
      ENABLE_ADMIN: ${GLITCHTIP_ENABLE_ADMIN:-True}
      ENABLE_OPENAPI: ${GLITCHTIP_ENABLE_OPENAPI:-True}
      GLITCHTIP_ENABLE_MCP: ${GLITCHTIP_ENABLE_MCP:-True}
      GLITCHTIP_ENABLE_DUCKDB: "False"
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - glitchtip-uploads:/code/uploads

volumes:
  glitchtip-uploads:
