services:
  mongo:
    image: mongo:${MONGO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - "${MONGO_DATA_DIR}/db:/data/db"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PWD:-example}"
    
  mongo-express:
    image: mongo-express:${MONGO_EXP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${MONGO_EXP_PORT:-18081}:8081"
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_PWD:-example}"
      ME_CONFIG_MONGODB_URL: mongodb://root:${MONGO_PWD:-example}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
